<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="ringGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ringRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="bullseyeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Wire / Rim -->
  <circle cx="256" cy="256" r="210" fill="#0f172a" stroke="#334155" stroke-width="8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringRed)" stroke-width="20" opacity="0.9"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#ringGreen)" stroke-width="16" opacity="0.9"/>
  
  <!-- Sector Lines -->
  <g stroke="#475569" stroke-width="3" opacity="0.5">
    <line x1="256" y1="46" x2="256" y2="466"/>
    <line x1="46" y1="256" x2="466" y2="256"/>
    <line x1="107" y1="107" x2="405" y2="405"/>
    <line x1="107" y1="405" x2="405" y2="107"/>
  </g>

  <!-- Outer Bull (Green) -->
  <circle cx="256" cy="256" r="42" fill="url(#ringGreen)" stroke="#0f172a" stroke-width="4" filter="url(#glow)"/>

  <!-- Bullseye (Red/Gold) -->
  <circle cx="256" cy="256" r="22" fill="url(#ringRed)" stroke="#fef08a" stroke-width="4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="8" fill="url(#bullseyeGold)"/>

  <!-- Crown / King Symbol on Top -->
  <path d="M196 140 L220 180 L256 120 L292 180 L316 140 L316 200 L196 200 Z" fill="url(#bullseyeGold)" stroke="#fbbf24" stroke-width="3" opacity="0.95" filter="url(#glow)"/>
</svg>